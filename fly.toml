# fly.toml — Fly.io deployment config for LLM Knowledge Base.
#
# Usage:
#   fly launch --no-deploy --copy-config --name <your-app-name>
#   fly volumes create kb_data --region <region> --size 3
#   fly secrets set ANTHROPIC_API_KEY=sk-ant-...
#   fly deploy
#
# Replace `llm-kb` below with your chosen app name before first launch,
# or let `fly launch` rewrite it for you.

app = "llm-kb"
primary_region = "iad"   # change to the region closest to you (e.g. lhr, fra, sin, syd)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  LOG_LEVEL = "info"
  # Point the app at the mounted volume so raw/, wiki/, outputs/ and the
  # SQLite index all live on persistent storage.
  ROOT_DIR = "/data"
  DB_PATH_NAME = "app.db"

[[mounts]]
  source = "kb_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
