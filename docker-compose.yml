services:
  llm-kb:
    build: .
    image: llm-kb:latest
    container_name: llm-kb
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-6}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Persistent knowledge base data outside the image.
      - ./raw:/app/raw
      - ./wiki:/app/wiki
      - ./outputs:/app/outputs
      - kb-db:/app/data
    # Keep the SQLite index next to the mounted data so it survives rebuilds.
    command: >
      sh -c "ln -sf /app/data/app.db /app/app.db || true;
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  kb-db:
